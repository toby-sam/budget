<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewp
    ort" content="width=device-width, initial-scale=1.0">
    <title>Solect Budget</title>

    <!-- Shared CSS -->
    <link rel="stylesheet" href="budget.css">
</head>

<body>

    <header class="navbar">
        <h1>Toby Budget – Solect Budget</h1>
        <div class="nav-links">
            <!-- Populated by nav.js -->
        </div>
    </header>

    <main class="container">

        <!-- ========================= -->
        <!-- Income & Summary          -->
        <!-- ========================= -->
        <section class="card">
            <h2>Income & Summary</h2>

            <div class="row summary-row">
                <div class="row summary-row" class="badge">
                    <div>
                        <div class="small">Manual Monthly Budget (SOL)</div>
                        <input id="manualMonthlyBudget" type="number" step="0.01" style="width:140px;" />
                    </div>

                    <div>
                        <div class="small">Total Spend</div>
                        <div id="summaryTotalSpend" class="badge"></div>
                    </div>

                    <div>
                        <div class="small">Profit / Loss (SOL)</div>
                        <div id="summaryProfitLoss" class="badge"></div>
                    </div>

                    <div>
                        <div class="small">Total Solect Budget</div>
                        <div id="summaryTotalBudget" class="badge">$0.00</div>
                    </div>
                </div>


                <div class="backup-controls">
                    <button id="refreshBtn" class="secondary">Refresh</button>
                </div>
        </section>

        <!-- ========================= -->
        <!-- Solect Categories             -->
        <!-- ========================= -->
        <section class="card">
            <h2>Solect Categories</h2>

            <div class="row" style="align-items:flex-end; gap:15px;">
                <div>
                    <label for="newCategoryName">New Category Name</label>
                    <input type="text" id="newCategoryName" placeholder="e.g. Nanay & Tatay">
                </div>

                <div>
                    <label for="newCategoryMonthly">Monthly Budget (SOL)</label>
                    <input type="number" id="newCategoryMonthly" step="0.01">
                </div>

                <button id="addCategoryBtn" class="primary">Add Category</button>
            </div>

            <div class="small" style="margin-top:0.5rem;">
                These categories are used for Solect transaction assignments.
            </div>

            <div class="table-wrapper" style="margin-top:0.75rem;">
                <table id="categoriesTable">
                    <thead>
                        <tr>
                            <th>Category</th>
                            <th class="amount">Budget (SOL)</th>
                            <th class="amount">Actual (SOL)</th>
                            <th class="amount">Difference</th>
                            <th>Status</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

        </section>

    </main>

    <!-- JS -->
    <script src="state.js"></script>
    <script src="nav.js"></script>
    <script src="solect-budget.js"></script>

</body>

</html>
